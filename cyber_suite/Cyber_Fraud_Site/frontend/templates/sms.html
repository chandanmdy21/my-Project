<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMS Spam Detection - Threat Analysis</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            font-family: 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Cyber Phishing Theme Background */
            background: #020202 url('https://images.unsplash.com/photo-1563986768609-322da13575f3?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ff3e3e; /* Threat Red */
            overflow: hidden;
        }

        /* Digital Overlay to darken image and add tech feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 90%),
                        rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Container Card */
        .container {
            position: relative;
            z-index: 1;
            width: 480px;
            background: rgba(10, 5, 5, 0.9);
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0px 0px 35px rgba(255, 62, 62, 0.3);
            border: 1px solid #ff3e3e;
            animation: glitchIn 0.5s ease-out;
            backdrop-filter: blur(10px);
        }

        /* CRT Scanline Effect */
        .container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 25px;
            color: #ff3e3e;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 22px;
            text-shadow: 0 0 15px rgba(255, 62, 62, 0.7);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff3e3e;
            border-radius: 2px;
            font-size: 14px;
            color: #ff9f9f;
            resize: none;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
        }

        textarea:focus {
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.4);
            border-color: #ff9f9f;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            border: 1px solid #ff3e3e;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            background: #ff3e3e;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: transparent;
            color: #ff3e3e;
            box-shadow: 0 0 25px rgba(255, 62, 62, 0.6);
        }

        #sms_result {
            margin-top: 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Cyber Animations */
        @keyframes glitchIn {
            0% { opacity: 0; transform: scale(0.9); filter: hue-rotate(90deg); }
            100% { opacity: 1; transform: scale(1); filter: hue-rotate(0deg); }
        }

        #sms_result::before {
            content: "> ";
            color: #ff3e3e;
        }

        /* Fake blinking cursor */
        #sms_result::after {
            content: "█";
            animation: blink 0.8s infinite;
            margin-left: 5px;
            color: #ff3e3e;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>

</head>

<body>
    

    <div class="container">

        <h2>[SMS_SPAM_SCANNER]</h2>

        <textarea id="message" placeholder="Input SMS payload for analysis..."></textarea>

        <button onclick="checkSMS()">Begin Forensic Scan</button>

        <p id="sms_result">SCANNER_STDBY</p>

    </div>

    <script>
        function checkSMS() {
            const resultDisplay = document.getElementById("sms_result");
            resultDisplay.innerText = "ANALYZING_PAYLOAD...";

            fetch("/check_sms", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: document.getElementById("message").value
                })
            })
            .then(res => res.json())
            .then(data => {
                // Flash effect on result
                resultDisplay.style.color = data.result.includes("Spam") ? "#ff3e3e" : "#00ff41";
                resultDisplay.innerText = "THREAT_LVL: " + data.result;
            })
            .catch(err => {
                resultDisplay.innerText = "CRITICAL_ERROR: UPLINK_LOST";
                resultDisplay.style.color = "#ff3e3e";
            });
        }
    </script>

</body>

</html>
