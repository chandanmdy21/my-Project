{% extends "base.html" %}

{% block content %}
<style>
    /* =========================================
       1. GLOBAL PAGE OVERRIDE (for background)
       ========================================= */
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Rajdhani', sans-serif;
        background: #01080e; /* Darker deep space blue */
        overflow: hidden;
        position: relative;
    }

    /* Unique 'Data Rain' Circuit Background Layer */
    body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(circle at 10% 10%, rgba(0, 242, 255, 0.1) 0%, transparent 40%),
            url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80'), /* High-res circuit pattern */
            linear-gradient(rgba(1, 8, 14, 0.93), rgba(1, 8, 14, 0.98)); /* Main color wash */
        background-size: cover;
        background-position: center;
        opacity: 0.6;
        z-index: -1;
    }

    /* =========================================
       2. LAYOUT & HOLOGRAPHIC CARD
       ========================================= */
    .profile-container {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px; /* For hover tilt effects */
    }
    
    .profile-box {
        position: relative;
        width: 440px;
        background: rgba(10, 20, 30, 0.9); /* Dark tech blue */
        padding: 45px;
        
        /* Dual Glowing Border with Corner Cuts */
        border: 2px solid #00f2ff;
        border-radius: 5px;
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.15), inset 0 0 15px rgba(0, 242, 255, 0.05);
        
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        overflow: hidden;
    }

    /* Scanner Scanline Overlay */
    .profile-box::after {
        content: "";
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(0, 242, 255, 0.6);
        box-shadow: 0 0 10px rgba(0, 242, 255, 1);
        animation: scanner-move 6s infinite;
        opacity: 0.4;
    }

    @keyframes scanner-move {
        0% { top: -10%; }
        50% { top: 110%; }
        100% { top: -10%; }
    }

    /* =========================================
       3. TEXT & DATA DISPLAYS
       ========================================= */
    
    /* Glitch Title effect */
    .glitch-title {
        font-family: 'Orbitron', sans-serif;
        color: #00f2ff;
        font-size: 1.8rem;
        letter-spacing: 4px;
        margin-bottom: 35px;
        position: relative;
        text-shadow: 0.05em 0 0 rgba(255,0,0,.75),
                    -0.025em -0.05em 0 rgba(0,255,0,.75),
                    0.025em 0.05em 0 rgba(0,0,255,.75);
        animation: glitch 1s infinite;
    }

    @keyframes glitch {
        0% { text-shadow: 0.5px 0 0 #ff00c1, -0.5px 0 0 #00fff9; }
        100% { text-shadow: 0.5px 0 0 #ff00c1, -0.5px 0 0 #00fff9; }
    }

    .info { 
        margin: 25px 0; 
        color: #e0fbfc; 
        font-size: 1.15rem;
        font-family: 'Rajdhani', sans-serif;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 242, 255, 0.1);
        padding-bottom: 5px;
    }

    .info strong {
        color: #00f2ff;
        text-transform: uppercase;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
    }

    /* Corrected Username variable color (WHITE) */
    .data-username {
        color: #ffffff; 
        font-weight: 700;
        letter-spacing: 1px;
    }

    .data-status {
        color: #00ffaa; /* Standard green status */
        font-weight: bold;
    }

    /* Data Corner Accents */
    .corner-tl { position: absolute; top: 10px; left: 10px; font-size: 0.7rem; color: #00f2ff; opacity: 0.5; }
    .corner-br { position: absolute; bottom: 10px; right: 10px; font-size: 0.7rem; color: #00f2ff; opacity: 0.5; }

    /* =========================================
       4. BUTTON - TACTICAL GREEN
       ========================================= */
    .return-btn {
        width: 100%;
        padding: 14px;
        background: transparent;
        color: #00ffaa;
        border: 2px solid #00ffaa;
        cursor: pointer;
        font-family: 'Orbitron', sans-serif;
        font-weight: bold;
        font-size: 0.85rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: 0.2s ease-in-out;
        margin-top: 25px;
        display: inline-block;
        text-decoration: none;
        outline: none;
        box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
    }

    .return-btn:hover {
        background: #00ffaa;
        color: #01080e;
        box-shadow: 0 0 25px rgba(0, 255, 170, 0.6);
        transform: translateY(-2px);
    }

    .return-btn:active {
        transform: translateY(1px);
        box-shadow: 0 0 5px rgba(0, 255, 170, 0.4);
    }
</style>

<div class="profile-container">
    <div class="profile-box">
        <div class="corner-tl">[+] SECURE_INTEL // ID: {{ session.user_id }}</div>
        
        <h2 class="glitch-title">USER PROFILE</h2>
        
        <div class="info">
            <strong>Username</strong> 
            <span class="data-username">{{ session.username }}</span>
        </div>
        
        <div class="info">
            <strong>System Status</strong> 
            <span class="data-status">ACTIVE</span>
        </div>
        
        <div class="info">
            <strong>Data Stream</strong> 
            <span style="color:#e0fbfc; font-size:0.9rem;">VERIFIED // C_S_SEC</span>
        </div>

        <div class="corner-br">-[-]-HUD_CONFIRMATION_ACTIVE</div>
        
        <a href="/home" style="text-decoration: none;">
            <button class="return-btn">
                ⬅ RETURN TO HUB
            </button>
        </a>
    </div>
</div>
{% endblock %}
